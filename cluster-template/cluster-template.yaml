# omnictl cluster template sync -v -f cluster-template-working.yaml
---
kind: Cluster
name: talos-prod-cluster
labels:
  cluster-id: "1"
kubernetes:
  version: v1.36.2
talos:
  version: v1.13.5
patches:
  - name: disable-default-cni
    inline:
      cluster:
        network:
          cni:
            name: none
        proxy:
          disabled: true
  # machine.network is deprecated since Talos 1.12 (multi-doc network config
  # documents replace it) but remains supported; Omni inline patches still
  # use the v1alpha1 form.
  - name: dns-config
    inline:
      machine:
        network:
          nameservers:
            - 192.168.10.1
            - 1.1.1.1
  # MANDATORY on Talos 1.13+: the LifecycleService install/upgrade flow
  # requires an explicit machine.install.disk. Without it, freshly
  # provisioned VMs wedge at stage UPGRADING / configuptodate=false forever
  # with NO error surfaced anywhere. Proxmox virtio-scsi-single + scsi0
  # presents as /dev/sda on every class in this template; a class with a
  # different bus (e.g. NVMe passthrough -> /dev/nvme0n1) needs a
  # per-machineset override.
  - name: install-disk
    inline:
      machine:
        install:
          disk: /dev/sda
---
kind: ControlPlane
machineClass:
  name: proxmox-control-plane
  size: 3
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfsd
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
---
kind: Workers
name: workers
machineClass:
  name: proxmox-worker
  size: 3
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfsd
  - siderolabs/qemu-guest-agent 
  - siderolabs/util-linux-tools
patches:
  - name: worker-labels
    inline:
      machine:
        nodeLabels:
          node-role.kubernetes.io/worker: ""
  - name: longhorn-storage
    inline:
      machine:
        kubelet:
          nodeIP:
            validSubnets:
              - 192.168.10.0/24
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/local/longhorn
              options:
                - bind
                - rshared
                - rw
---
kind: Workers
name: gpu-workers
machineClass:
  name: proxmox-gpu-worker
  size: 1
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/nfsd
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/nonfree-kmod-nvidia-production
  - siderolabs/nvidia-container-toolkit-production
patches:
  - name: worker-labels
    inline:
      machine:
        nodeLabels:
          node-role.kubernetes.io/worker: ""
  - file: patches/gpu-worker.yaml
  - name: longhorn-storage
    inline:
      machine:
        kubelet:
          nodeIP:
            validSubnets:
              - 192.168.10.0/24
          extraMounts:
            - destination: /var/lib/longhorn
              type: bind
              source: /var/local/longhorn
              options:
                - bind
                - rshared
                - rw